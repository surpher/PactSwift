name: Build

on:
  pull_request:
    types:
        - opened
        - synchronize
        - reopened
        - ready_for_review
  workflow_dispatch:

env:
  RUST_TARGET_PATH: pact-reference

jobs:
  test_ios:
    name: "🤖 Test iOS"
    runs-on: ${{ matrix.host }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - host: macos-15
            xcode: "16.4"
            scheme: "PactSwift-iOS"
            destination: "platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5"
          - host: macos-26
            xcode: "26.5"
            scheme: "PactSwift-iOS"
            destination: "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5"
          # - host: macos-27
          #   xcode: "27.0 (beta)"
          #   scheme: "PactSwift-iOS"
          #   destination: "platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0"
          - host: macos-15
            xcode: "16.4"
            scheme: "PactSwift-macOS"
            destination: "arch=x86_64"
          - host: macos-26
            xcode: "26.5"
            scheme: "PactSwift-macOS"
            destination: "arch=arm64"
          # - host: macos-27
          #   xcode: "27.0 (beta)"
          #   scheme: "PactSwift-macOS"
          #   destination: "arch=x86_64"

    env:
      SCHEME: ${{ matrix.scheme }}
      DESTINATION: ${{ matrix.destination }}

    concurrency:
      group: test_${{ matrix.host }}_${{ matrix.xcode }}_${{ matrix.scheme}}_${{ matrix.destination }}_${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: "🧑‍💻 Checkout repository"
        uses: actions/checkout@v3

      - name: "🏭 Use Xcode ${{ matrix.xcode }}"
        run: sudo xcode-select -switch /Applications/Xcode_${{ matrix.xcode }}.app

      - name: "🧪 Run tests (xcodebuild)"
        run: |
          set -o pipefail && \
          xcodebuild -resolvePackageDependencies && \
          xcodebuild test \
            -project PactSwift.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            | xcbeautify

    #   - name: "⚗️ Run tests (swift)"
    #     run: |
    #       swift build
    #       swift test -c release
